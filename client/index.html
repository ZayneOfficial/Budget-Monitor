<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Monitor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <body>

<div class="container">

<header>

<h1>💰 Budget Monitor</h1>

<button id="themeToggle">🌙</button>

</header>

    <form id="transactionForm">
        <input type="text" id="name" placeholder="Transaction Name" required>

        <input type="text" id="category" placeholder="Category" required>

        <input type="number" id="amount" placeholder="Amount" required>

        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <input type="date" id="transaction_date" required>

        <button type="submit">Add Transaction</button>
    </form>

    <div class="summary-cards">

    <div class="card income-card">
        <h3>Total Income</h3>
        <h2 id="totalIncome">R0.00</h2>
    </div>

    <div class="card expense-card">
        <h3>Total Expenses</h3>
        <h2 id="totalExpense">R0.00</h2>
    </div>

    <div class="card balance-card">
        <h3>Balance</h3>
        <h2 id="balance">R0.00</h2>
    </div>

</div>

<div class="filters">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search transaction...">

    <select id="filterCategory">

        <option value="">All Categories</option>

        <option>Food</option>
        <option>Transport</option>
        <option>Rent</option>
        <option>Utilities</option>
        <option>Salary</option>
        <option>Shopping</option>
        <option>Entertainment</option>

    </select>

    <select id="filterType">

        <option value="">All Types</option>

        <option value="income">Income</option>

        <option value="expense">Expense</option>
        
    </select>

    <input type="month" id="filterMonth">

</div>

<div class="dashboard">

    <div class="table-section">

        <!-- Your existing table goes here -->

    </div>

    <div class="chart-section">

        <h2>Expenses by Category</h2>

        <canvas id="expenseChart"></canvas>

    </div>

</div>

<div class="table-container">



    <h2>Transactions</h2>

<table border="1" cellpadding="10">
    <thead>
        <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody id="transactionTable"></tbody>
</table>
</div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/chart.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/filters.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
</html>
