<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6f9">
    <title>Budget Monitor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Budget Monitor</h1>
            <button id="themeToggle" type="button" aria-label="Toggle dark theme">🌙</button>
        </header>

        <p id="appStatus" class="app-status" role="status" aria-live="polite"></p>

        <form id="transactionForm">
            <input type="text" id="name" placeholder="Transaction name" maxlength="255" required>
            <input type="text" id="category" placeholder="Category" maxlength="100" required>
            <input type="number" id="amount" placeholder="Amount" min="0.01" step="0.01" required>
            <select id="type" aria-label="Transaction type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <input type="date" id="transaction_date" required>
            <button type="submit">Add Transaction</button>
        </form>

        <section class="summary-cards" aria-label="Budget summary">
            <div class="card income-card">
                <h2>Total Income</h2>
                <p id="totalIncome">R0.00</p>
            </div>
            <div class="card expense-card">
                <h2>Total Expenses</h2>
                <p id="totalExpense">R0.00</p>
            </div>
            <div class="card balance-card">
                <h2>Balance</h2>
                <p id="balance">R0.00</p>
            </div>
        </section>

        <section class="filters" aria-label="Filter transactions">
            <input type="search" id="searchInput" placeholder="Search transactions" aria-label="Search transactions">
            <select id="filterCategory" aria-label="Filter by category">
                <option value="">All categories</option>
            </select>
            <select id="filterType" aria-label="Filter by type">
                <option value="">All types</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <input type="month" id="filterMonth" aria-label="Filter by month">
        </section>

        <section class="dashboard">
            <div class="chart-section">
                <h2>Expenses by Category</h2>
                <canvas id="expenseChart" aria-label="Expenses by category chart"></canvas>
            </div>
        </section>

        <section class="table-container">
            <h2>Transactions</h2>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Category</th>
                        <th scope="col">Amount</th>
                        <th scope="col">Type</th>
                        <th scope="col">Date</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="transactionTable"></tbody>
            </table>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
